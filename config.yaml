# ValueBet Engine configuration.
# Shape and defaults come from SPEC.md and docs/decisions.md (phase 0);
# secrets live in .env, never here.

leagues:
  - slug: premier_league
    name: Premier League
    fd_code: E0
    understat_league: ENG-Premier League
    toa_sport_key: soccer_epl
    api_football_id: 39          # historical backfill only (2022-2024)
    totals_lines_available: [2.25, 2.5, 2.75, 3.0, 3.25, 3.5]   # measured, phase 0
  - slug: la_liga
    name: La Liga
    fd_code: SP1
    understat_league: ESP-La Liga
    toa_sport_key: soccer_spain_la_liga
    api_football_id: 140
    totals_lines_available: [1.5, 2.0, 2.25, 2.5, 2.75, 3.0, 3.5, 4.0, 4.25, 4.5]
  - slug: serie_a
    name: Serie A
    fd_code: I1
    understat_league: ITA-Serie A
    toa_sport_key: soccer_italy_serie_a
    api_football_id: 135
    totals_lines_available: [0.5, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75]
  - slug: bundesliga
    name: Bundesliga
    fd_code: D1
    understat_league: GER-Bundesliga
    toa_sport_key: soccer_germany_bundesliga
    api_football_id: 78
    totals_lines_available: [2.5, 3.0, 3.25, 3.5, 3.75, 4.0, 4.5]
  - slug: ligue_1
    name: Ligue 1
    fd_code: F1
    understat_league: FRA-Ligue 1
    toa_sport_key: soccer_france_ligue_one     # NOT ligue_1 (phase 0 finding)
    api_football_id: 61
    totals_lines_available: [2.25, 2.5, 2.75, 3.0, 3.25, 3.5]
  - slug: ucl
    name: UEFA Champions League
    fd_code: null                # football-data has no UCL
    understat_league: null       # Understat has no UCL
    toa_sport_key: soccer_uefa_champs_league
    api_football_id: 2
    ucl: true
    experimental: true           # totals only, higher edge (SPEC §1, phase 11)
    totals_edge_threshold: 0.06
    totals_lines_available: [2.5, 2.75, 3.0, 3.25, 3.5, 4.0, 4.5]

database:
  url: sqlite:///./valuebet.db

model:                           # frozen by phase-4 backtest (FROZEN_CONFIG.json)
  xi: 0.002                      # validated 2023/24-2024/25, LL 2.9112 (baseline 0.005: 2.9148)
  weight_xg: 0.5                 # w=1.0 uniformly worst on validation

thresholds:
  totals_edge: 0.04
  multiscore_edge: 0.08
  exact_score_edge: 0.12
  exact_score_min_p: 0.04
  exact_score_max_odds: 21.0

risk_flags:
  key_player_min_starts_share: 0.70
  key_player_last_n: 8
  absence_edge_multiplier: 1.5
  max_key_absences_per_team: 2

odds_policy:
  tier_windows: { t48: [40, 56], t24: [18, 30], t3: [1, 4] }   # hours
  t3_granularity: slot          # day = degradation step only (decisions S1)
  max_firing_delay_min: 15
  retry_on_error: 1
  t1_bet_market: false
  monthly_quota: 500
  hard_stop_credits: 450
  degradation_ladder:
    - cap_additional_markets_top5_week
    - disable_t48
    - disable_t24
    - t3_slot_to_day
  pacing: { enabled: true, safety_margin_credits: 25 }
  t4_recheck: true
  postponement: { shift_min: 15, no_result_after_h: 3, void_after_h: 48 }
  scores_poll_after_matchday: true
  scores_poll_weekly: true

prefilter:
  delta_btts: 0.05              # placeholder; tuned in phase 5
  edge_fraction: 0.5
  weekly_cap: 15

books:                            # keys as returned by The Odds API
  market_reference_books: [pinnacle, consensus_of_allowed]
  bookmaker_whitelist: [fortuna]
  excluded_books: [onexbet, betonlineag, mybookieag, gtbets, betfair, matchbook]

totals_lines:
  requested: [0.5, 1.5, 2.5, 3.5, 4.5]
  half_lines_only: true         # integer/quarter lines filtered + logged (S11)

llm:
  extraction_model: gemini-3.8-flash
  reasoning_model: gemini-3.8-flash
  reasoning_thinking_budget: 4096
  fallback_model: gemini-3.7-flash

ingest:
  fd_current_season_ttl_hours: 12
  retry_attempts: 3
  retry_backoff_s: 2.0

scheduler:
  timezone: UTC
  refresh_history_cron: "30 5 * * *"
  events_poll_cron: "0 */6 * * *"   # free /events only; snapshots are event-driven
  retrain_model_cron: "0 6 * * *"
  news_windows: [T-24h, T-2h]
