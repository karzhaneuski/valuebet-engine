name: ci

on:
  push:
    branches: [main, "phase-*", "spec-*", "v3-*"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Secrets scan (history + working tree)
        run: |
          PAT=$(uv run python -c 'from core.http import ASSIGNMENT_PATTERN; print(ASSIGNMENT_PATTERN.pattern)')
          RAW_PAT='(tvly-[A-Za-z0-9.\-_]{10,}|AIza[A-Za-z0-9_.\-]{20,}|BSA[A-Za-z0-9_.\-]{15,})'
          echo "scan pattern: $PAT"
          echo "raw pattern: $RAW_PAT"
          if git log --all -p -- ':!.github/secrets_allowlist.txt' | grep -iP "$PAT" | grep -vxF -f .github/secrets_allowlist.txt | grep -qP '.'; then
            echo "secret-like pattern found in git history"; exit 1
          fi
          if git grep -iP "$PAT" -- . ':!*.lock' ':!.github/secrets_allowlist.txt' | grep -qP '.'; then
            echo "secret-like pattern found in tracked files"; exit 1
          fi
          if git log --all -p -- ':!.github/secrets_allowlist.txt' | grep -iP "$RAW_PAT" | grep -vxF -f .github/secrets_allowlist.txt | grep -qP '.'; then
            echo "hardcoded API key token pattern found in git history"; exit 1
          fi
          if git grep -iP "$RAW_PAT" -- . ':!*.lock' ':!core/http.py' ':!.github/secrets_allowlist.txt' | grep -qP '.'; then
            echo "hardcoded API key token pattern found in tracked files"; exit 1
          fi
      - name: Check no stubs
        run: uv run python scripts/check_no_stubs.py
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Mypy (strict on core)
        run: uv run mypy --strict core/model core/backtest core/value core/news core/llm core/tracking core/scheduler
      - name: Pytest
        run: uv run pytest
      - name: Alembic migration from scratch + seed
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed_team_aliases.py
          rm -f ci-check.db
      - name: Ingest invariants on fixture database
        env:
          DATABASE_URL: sqlite:///./ci-fixture.db
        run: |
          uv run python scripts/build_fixture_db.py
          uv run python -m core.ingest checks
          rm -f ci-fixture.db

      - name: Alembic check (migration matches ORM)
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
          rm -f ci-check.db

  docker-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build image for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: valuebet-engine:ci
      - name: Smoke test (imports incl. native/tls deps)
        run: >
          docker run --rm --platform linux/arm64 valuebet-engine:ci
          python -c "import soccerdata, core.config; print('ok')"
