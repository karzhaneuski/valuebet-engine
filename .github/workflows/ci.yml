name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Secrets scan (history + working tree)
        run: |
          if git log --all -p | grep -qE 'apiKey=[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9-]{16,}|BSA[A-Za-z0-9_-]{15,}'; then
            echo "secret-like pattern found in git history"; exit 1
          fi
          if git grep -qE '(apiKey|api_key)=[A-Za-z0-9_-]{20,}' -- . ':!*.lock' ; then
            echo "secret-like pattern found in tracked files"; exit 1
          fi
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
      - name: Alembic migration from scratch + seed
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed_team_aliases.py
          rm -f ci-check.db
      - name: Alembic check (migration matches ORM)
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
          rm -f ci-check.db

  docker-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build image for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: valuebet-engine:ci
      - name: Smoke test (imports incl. native/tls deps)
        run: >
          docker run --rm --platform linux/arm64 valuebet-engine:ci
          python -c "import soccerdata, core.config; print('ok')"
