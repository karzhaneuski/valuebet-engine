# Phase-1 stubs; every service answers a health check. Real logic arrives in
# phases 7-9; production deployment (Caddy/Tailscale, backups, limits) in
# phase 10. Build once: docker build --platform linux/arm64 -t valuebet-engine:dev .

services:
  api:
    image: valuebet-engine:dev
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/valuebet.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  scheduler:
    image: valuebet-engine:dev
    command: uvicorn core.scheduler.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/valuebet.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mcp:
    image: valuebet-engine:dev
    command: uvicorn mcp.main:app --host 0.0.0.0 --port 8002
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    image: valuebet-engine:dev
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
