[project]
name = "valuebet-engine"
version = "0.0.0"
description = "Value bet discovery engine for football"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "requests",
    "soccerdata==2026.43.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.35",
    "apscheduler>=3.10",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "httpx>=0.27",
    "types-PyYAML",
    "respx>=0.23.1",
    "scipy-stubs>=1.18.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "reports",
    # phase-0 exploratory scripts, frozen as reproducibility artifacts
    # (docs/data-sources.md); not held to production lint standards
    "scripts/recon",
    # autogenerated migrations
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Cyrillic user-facing text, Polish betting terminology, and typographic dashes
"core/value/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_fortuna_input.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["core", "api", "mcp_server", "tests"]
exclude = ["scripts/"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["soccerdata", "soccerdata.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tls_requests", "tls_requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the full --strict flag set, spelled out because `strict = true` in a
# per-module section leaks globally (verified with mypy 1.19); the phase
# gate is additionally `uv run mypy --strict core/model`
module = ["core.model.*", "core.value.*", "core.backtest.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
